components:
    parameters:
        AfterCursor:
            description: Cursor for forward pagination. Returns items after this cursor.
            in: query
            name: after
            schema:
                example: eyJpZCI6ImhvdXNlaG9sZF8wMUFSWjNOREVLVFNWNFJSRkZRNjlHNUZBViJ9
                type: string
        BeforeCursor:
            description: Cursor for backward pagination. Returns items before this cursor.
            in: query
            name: before
            schema:
                example: eyJpZCI6ImhvdXNlaG9sZF8wMUFSWjNOREVLVFNWNFJSRkZRNjlHNUZBViJ9
                type: string
        Limit:
            description: Maximum number of items to return
            in: query
            name: limit
            schema:
                default: 50
                maximum: 1000
                minimum: 1
                type: integer
    responses:
        DefaultError:
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Error'
            description: General Error
    schemas:
        Asset:
            properties:
                asset_class:
                    $ref: '#/components/schemas/AssetClass'
                display_name:
                    description: Display name of the asset
                    example: Apple Inc. Stock
                    type: string
                external_id:
                    description: External ID from the static asset (if available)
                    example: AAPL-12345
                    nullable: true
                    type: string
                id:
                    description: Asset ID
                    example: assetv2_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                value:
                    description: Value of this asset in USD
                    example: 50000
                    format: double
                    type: number
            required:
                - id
                - display_name
                - value
                - asset_class
            type: object
        AssetClass:
            properties:
                display_name:
                    description: Display name of the asset class
                    example: Equities
                    type: string
                id:
                    description: Asset class ID
                    example: asset_class_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
            required:
                - id
                - display_name
            type: object
        CreateAssetRequest:
            properties:
                asset_class_id:
                    description: Asset class ID to associate with this asset
                    example: asset_class_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                display_name:
                    description: Display name of the asset
                    example: Apple Inc. Stock
                    minLength: 1
                    type: string
                external_id:
                    description: External ID for the asset
                    example: AAPL-12345
                    minLength: 1
                    nullable: true
                    type: string
                value:
                    description: Value of this asset in USD
                    example: 50000
                    format: double
                    type: number
            required:
                - display_name
                - value
                - asset_class_id
            type: object
        CreateDocumentRequest:
            properties:
                enable_ai_suggestions:
                    default: false
                    description: Whether this document should be used for AI suggestions
                    type: boolean
                entity_id:
                    description: Entity ID if this document is owned by an entity
                    example: entity_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                file:
                    description: The document file to upload
                    format: binary
                    type: string
                household_id:
                    description: Household ID this document belongs to
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                individual_id:
                    description: Individual ID if associated with an individual
                    example: client_profile_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                name:
                    description: Display name of the document
                    example: Trust Agreement.pdf
                    minLength: 1
                    type: string
                type:
                    $ref: '#/components/schemas/DocumentType'
            required:
                - name
                - type
                - household_id
                - file
            type: object
        CreateHouseholdRequest:
            properties:
                external_id:
                    description: Customer-supplied identifier from an external system. Unique within the caller's tenant when set.
                    example: crm-household-12345
                    minLength: 1
                    nullable: true
                    type: string
                notes:
                    description: Optional notes about the household
                    maxLength: 65536
                    nullable: true
                    type: string
                primary_individuals:
                    description: Primary client profiles to create for this household (at most 2)
                    items:
                        $ref: '#/components/schemas/CreatePrimaryIndividualRequest'
                    maxItems: 2
                    minItems: 1
                    type: array
                primary_relationship_owner_id:
                    description: User ID of the primary relationship owner
                    example: user_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
            required:
                - primary_relationship_owner_id
            type: object
        CreateIndividualRequest:
            properties:
                address_line1:
                    description: Street address line 1
                    minLength: 1
                    nullable: true
                    type: string
                address_line2:
                    description: Street address line 2
                    minLength: 1
                    nullable: true
                    type: string
                city:
                    description: City
                    minLength: 1
                    nullable: true
                    type: string
                country:
                    description: Country
                    minLength: 1
                    nullable: true
                    type: string
                date_of_birth:
                    description: Date of birth
                    format: date
                    nullable: true
                    type: string
                email:
                    description: Email address
                    format: email
                    nullable: true
                    type: string
                first_name:
                    description: First name of the individual
                    example: John
                    minLength: 1
                    type: string
                household_id:
                    description: Household ID this individual belongs to
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                is_beneficiary:
                    default: false
                    description: Whether this client profile should be an eligible beneficiary for entities and gifts
                    type: boolean
                is_deceased:
                    default: false
                    description: Whether the individual is deceased
                    type: boolean
                is_grantor:
                    default: false
                    description: Whether this client profile should be an eligible grantor/owner/other principal for entities
                    type: boolean
                is_primary:
                    default: false
                    description: Whether this is a primary client of the household (at most 2 per household)
                    type: boolean
                is_trustee:
                    default: false
                    description: Whether this client profile should be an eligible trustee for entities
                    type: boolean
                last_name:
                    description: Last name of the individual
                    example: Smith
                    minLength: 1
                    type: string
                middle_name:
                    description: Middle name of the individual
                    minLength: 1
                    nullable: true
                    type: string
                notes:
                    description: Notes about the client profile
                    maxLength: 65536
                    nullable: true
                    type: string
                postal_code:
                    description: ZIP or postal code
                    minLength: 1
                    nullable: true
                    type: string
                state:
                    description: State or province code (2 letter code)
                    maxLength: 2
                    minLength: 2
                    nullable: true
                    type: string
                suffix:
                    description: Name suffix
                    minLength: 1
                    nullable: true
                    type: string
            required:
                - first_name
                - last_name
                - household_id
            type: object
        CreatePrimaryIndividualRequest:
            properties:
                address_line1:
                    description: Street address line 1
                    minLength: 1
                    nullable: true
                    type: string
                address_line2:
                    description: Street address line 2
                    minLength: 1
                    nullable: true
                    type: string
                city:
                    description: City
                    minLength: 1
                    nullable: true
                    type: string
                country:
                    description: Country
                    minLength: 1
                    nullable: true
                    type: string
                date_of_birth:
                    description: Date of birth
                    format: date
                    nullable: true
                    type: string
                email:
                    description: Email address
                    format: email
                    nullable: true
                    type: string
                first_name:
                    description: First name of the individual
                    example: John
                    minLength: 1
                    type: string
                is_beneficiary:
                    default: false
                    description: Whether this client profile should be an eligible beneficiary for entities and gifts
                    type: boolean
                is_deceased:
                    default: false
                    description: Whether the individual is deceased
                    type: boolean
                is_trustee:
                    default: false
                    description: Whether this client profile should be an eligible trustee for entities
                    type: boolean
                last_name:
                    description: Last name of the individual
                    example: Smith
                    minLength: 1
                    type: string
                middle_name:
                    description: Middle name of the individual
                    minLength: 1
                    nullable: true
                    type: string
                notes:
                    description: Notes about the client profile
                    maxLength: 65536
                    nullable: true
                    type: string
                postal_code:
                    description: ZIP or postal code
                    minLength: 1
                    nullable: true
                    type: string
                state:
                    description: State or province code (2 letter code)
                    maxLength: 2
                    minLength: 2
                    type: string
                suffix:
                    description: Name suffix
                    minLength: 1
                    nullable: true
                    type: string
            required:
                - first_name
                - last_name
                - state
            type: object
        CreateValuationRequest:
            properties:
                description:
                    description: Free-form notes about this valuation
                    maxLength: 2048
                    nullable: true
                    type: string
                directly_held_assets:
                    description: List of assets to include in this valuation
                    items:
                        $ref: '#/components/schemas/CreateAssetRequest'
                    type: array
                effective_date:
                    description: The date this valuation is effective
                    example: "2024-01-15"
                    format: date
                    type: string
            required:
                - effective_date
                - directly_held_assets
            type: object
        Document:
            properties:
                created_at:
                    description: Timestamp when the document was created
                    example: "2024-01-15T09:30:00Z"
                    format: date-time
                    type: string
                enable_ai_suggestions:
                    default: false
                    description: Whether this document should be used for AI suggestions
                    type: boolean
                entity_id:
                    description: Entity ID if this document is owned by an entity
                    example: entity_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    nullable: true
                    type: string
                household_id:
                    description: Household ID this document belongs to
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                id:
                    description: Unique identifier with document_ prefix
                    example: document_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                individual_id:
                    description: Individual ID if this document is associated with an individual
                    example: client_profile_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    nullable: true
                    type: string
                name:
                    description: Display name of the document
                    example: Trust Agreement.pdf
                    type: string
                type:
                    $ref: '#/components/schemas/DocumentType'
                updated_at:
                    description: Timestamp when the document was last updated
                    example: "2024-01-20T14:45:00Z"
                    format: date-time
                    type: string
            required:
                - id
                - name
                - type
                - household_id
                - created_at
                - updated_at
            type: object
        DocumentList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Document'
                    type: array
                page_info:
                    $ref: '#/components/schemas/PageInfo'
                total_count:
                    description: Total number of items matching the query (across all pages)
                    example: 100
                    type: integer
            required:
                - data
                - page_info
                - total_count
            type: object
        DocumentSummary:
            properties:
                created_at:
                    description: Timestamp when the summary was created
                    format: date-time
                    type: string
                display_name:
                    description: Display name for the summary
                    example: Default summary
                    type: string
                document_id:
                    description: ID of the document this summary belongs to
                    example: document_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                entry_mode:
                    $ref: '#/components/schemas/DocumentSummaryEntryMode'
                household_id:
                    description: ID of the household this summary belongs to
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                id:
                    description: Unique identifier for the document summary
                    example: document_summary_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                summary:
                    description: The summary text content
                    type: string
                summary_format:
                    $ref: '#/components/schemas/DocumentSummaryFormat'
                updated_at:
                    description: Timestamp when the summary was last updated
                    format: date-time
                    type: string
            required:
                - id
                - document_id
                - household_id
                - summary
                - display_name
                - created_at
                - updated_at
            type: object
        DocumentSummaryEntryMode:
            default: AI_AUTO
            description: Indicates if the summary was AI-generated or user-entered
            enum:
                - AI_AUTO
                - USER
            type: string
        DocumentSummaryFormat:
            default: MARKDOWN
            description: Format of the summary content
            enum:
                - MARKDOWN
                - PLAIN_TEXT
            type: string
        DocumentSummaryList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/DocumentSummary'
                    type: array
                page_info:
                    $ref: '#/components/schemas/PageInfo'
                total_count:
                    description: Total number of items matching the query (across all pages)
                    example: 100
                    type: integer
            required:
                - data
                - page_info
                - total_count
            type: object
        DocumentType:
            description: Type of document
            enum:
                - GRAT_DESIGN_SUMMARY
                - GENERATED_PRESENTATION
                - ASSET_VALUATION
                - SIGNED_TRUST_DOCUMENT
                - TRUST_AMENDMENT
                - TRANSFER_CONFIRMATION
                - EXISTING_REMAINDER_TRUST_DOCUMENT
                - BALANCE_SHEET
                - WILL
                - WILL_CODICIL
                - POWER_OF_ATTORNEY
                - ASSIGNMENT_OF_INTEREST
                - ASSIGNMENT_OF_TANGIBLE_PROPERTY
                - LOAN_NOTE_AGREEMENT
                - ARTICLES_OF_INCORPORATION
                - OPERATING_AGREEMENT
                - PARTNERSHIP_AGREEMENT
                - ACCOUNT_DOCUMENTATION_STATEMENT
                - TAX_ID_CONFIRMATION
                - GIFT_TAX_RETURN
                - INCOME_TAX_RETURN
                - TAX_RECEIPT
                - TAX_FILING
                - CORPORATE_BYLAWS
                - LLC_AGREEMENT
                - LLC_AGREEMENT_AMENDMENT
                - OPERATING_AGREEMENT_AMENDMENT
                - PARTNERSHIP_AGREEMENT_AMENDMENT
                - SHAREHOLDERS_AGREEMENT
                - STATE_BUSINESS_FILING
                - LOGGED_CONTRIBUTION
                - LOGGED_DISTRIBUTION
                - INSURANCE_POLICY
                - CRUMMEY_LETTER
                - INSURANCE_PREMIUM_PAYMENT
                - BENEFICIAL_OWNERSHIP_INFORMATION_REPORT
                - FINCEN_FILING
                - HEALTHCARE_PROXY
                - LIVING_WILL
                - DRIVERS_LICENSE
                - PASSPORT
                - DEED
                - OTHER
            type: string
        Entity:
            properties:
                created_at:
                    description: Timestamp when the entity was created
                    example: "2024-01-15T09:30:00Z"
                    format: date-time
                    type: string
                display_name:
                    description: Display name of the entity
                    example: My Revocable Trust
                    type: string
                external_id:
                    description: Customer-supplied identifier from an external system. Unique within the caller's tenant when set.
                    example: crm-entity-12345
                    minLength: 1
                    nullable: true
                    type: string
                household_id:
                    description: Household ID this entity belongs to
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                id:
                    description: Unique identifier with entity_ prefix
                    example: entity_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                in_estate_status:
                    $ref: '#/components/schemas/InEstateStatus'
                kind:
                    $ref: '#/components/schemas/EntityKind'
                stage:
                    $ref: '#/components/schemas/EntityStage'
                updated_at:
                    description: Timestamp when the entity was last updated
                    example: "2024-01-20T14:45:00Z"
                    format: date-time
                    type: string
            required:
                - id
                - display_name
                - kind
                - stage
                - in_estate_status
                - household_id
                - created_at
                - updated_at
            type: object
        EntityKind:
            description: Type of entity - determines the specific subtype and applicable fields
            enum:
                - REVOCABLE_TRUST
                - IRREVOCABLE_TRUST
                - SLAT_TRUST
                - ILIT_TRUST
                - QPRT_TRUST
                - GRAT_TRUST
                - CRT_TRUST
                - CLT_TRUST
                - INDIVIDUAL_PERSONAL_ACCOUNT
                - JOINT_PERSONAL_ACCOUNT
                - CUSTODIAL_PERSONAL_ACCOUNT
                - INSURANCE_PERSONAL_ACCOUNT
                - QUALIFIED_TUITION_PERSONAL_ACCOUNT
                - RETIREMENT_PERSONAL_ACCOUNT
                - DONOR_ADVISED_FUND
                - PRIVATE_FOUNDATION
                - LLC_BUSINESS_ENTITY
                - LP_BUSINESS_ENTITY
                - GP_BUSINESS_ENTITY
                - SOLE_PROPRIETORSHIP_BUSINESS_ENTITY
                - SCORP_BUSINESS_ENTITY
                - CCORP_BUSINESS_ENTITY
            type: string
        EntityList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Entity'
                    type: array
                page_info:
                    $ref: '#/components/schemas/PageInfo'
                total_count:
                    description: Total number of items matching the query (across all pages)
                    example: 100
                    type: integer
            required:
                - data
                - page_info
                - total_count
            type: object
        EntityStage:
            description: Lifecycle stage of the entity
            enum:
                - PRE_CREATED
                - AI_CREATING
                - AI_CREATION_FAILED
                - AI_NEEDS_REVIEW
                - DRAFT
                - READY_FOR_PROPOSAL
                - IMPLEMENTATION
                - ACTIVE
                - COMPLETED
                - ARCHIVED
            type: string
        Error:
            properties:
                code:
                    description: Error code
                    example: INVALID_REQUEST
                    type: string
                details:
                    items:
                        $ref: '#/components/schemas/FieldError'
                    nullable: true
                    type: array
                message:
                    description: Error message
                    example: Invalid request parameters
                    type: string
            required:
                - code
                - message
            type: object
        FieldError:
            properties:
                field:
                    description: Field that failed validation
                    example: name
                    type: string
                message:
                    description: Error message
                    example: Name is required
                    type: string
            required:
                - field
                - message
            type: object
        Household:
            properties:
                created_at:
                    description: Timestamp when the household was created
                    example: "2024-01-15T09:30:00Z"
                    format: date-time
                    type: string
                external_id:
                    description: Customer-supplied identifier from an external system. Unique within the caller's tenant when set.
                    example: crm-household-12345
                    minLength: 1
                    nullable: true
                    type: string
                id:
                    description: Unique identifier with household_ prefix
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                name:
                    description: Display name for the household
                    example: Smith Family
                    type: string
                notes:
                    description: Notes about the household
                    maxLength: 65536
                    nullable: true
                    type: string
                primary_individuals:
                    description: Primary client profiles for this household (at most 2)
                    items:
                        $ref: '#/components/schemas/Individual'
                    maxItems: 2
                    type: array
                primary_relationship_owner_id:
                    description: User ID of the primary relationship owner
                    example: user_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                updated_at:
                    description: Timestamp when the household was last updated
                    example: "2024-01-20T14:45:00Z"
                    format: date-time
                    type: string
            required:
                - id
                - primary_relationship_owner_id
                - created_at
                - updated_at
            type: object
        HouseholdList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Household'
                    type: array
                page_info:
                    $ref: '#/components/schemas/PageInfo'
                total_count:
                    description: Total number of items matching the query (across all pages)
                    example: 100
                    type: integer
            required:
                - data
                - page_info
                - total_count
            type: object
        InEstateStatus:
            description: Whether the entity is in or out of the estate
            enum:
                - in_estate
                - out_of_estate
                - none
            type: string
        Individual:
            properties:
                address_line1:
                    description: Street address line 1 (from address edge)
                    example: 123 Main St
                    nullable: true
                    type: string
                address_line2:
                    description: Street address line 2 (from address edge)
                    example: Apt 4B
                    nullable: true
                    type: string
                city:
                    description: City (from address edge)
                    example: San Francisco
                    nullable: true
                    type: string
                country:
                    description: Country (from address edge)
                    example: USA
                    nullable: true
                    type: string
                created_at:
                    description: Timestamp when the individual was created
                    example: "2024-01-15T09:30:00Z"
                    format: date-time
                    type: string
                date_of_birth:
                    description: Date of birth (encrypted field)
                    example: "1980-05-15"
                    format: date
                    nullable: true
                    type: string
                date_of_death:
                    description: Date of death if applicable (encrypted field)
                    format: date
                    nullable: true
                    type: string
                deleted_at:
                    description: Timestamp when the individual was soft deleted
                    format: date-time
                    nullable: true
                    type: string
                email:
                    description: Email address
                    example: john.smith@example.com
                    format: email
                    nullable: true
                    type: string
                first_name:
                    description: First name of the individual
                    example: John
                    type: string
                household_id:
                    description: Household ID this individual belongs to
                    example: household_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                id:
                    description: Unique identifier with client_profile_ prefix
                    example: client_profile_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                is_beneficiary:
                    default: false
                    description: Whether this client profile should be an eligible beneficiary for entities and gifts
                    type: boolean
                is_deceased:
                    default: false
                    description: Whether this client profile is deceased
                    type: boolean
                is_grantor:
                    default: false
                    description: Whether this client profile should be an eligible grantor/owner/other principal for entities
                    type: boolean
                is_primary:
                    default: false
                    description: Whether this is one of the (at most) two primary clients on this household
                    type: boolean
                is_trustee:
                    default: false
                    description: Whether this client profile should be an eligible trustee for entities
                    type: boolean
                last_name:
                    description: Last name of the individual
                    example: Smith
                    type: string
                middle_name:
                    description: Middle name of the individual
                    example: Michael
                    nullable: true
                    type: string
                notes:
                    description: Notes about the client profile
                    maxLength: 65536
                    nullable: true
                    type: string
                postal_code:
                    description: ZIP or postal code (from address edge)
                    example: "94102"
                    nullable: true
                    type: string
                state:
                    description: State or province (from address edge)
                    example: CA
                    nullable: true
                    type: string
                suffix:
                    description: Name suffix (Jr., Sr., III, etc.)
                    example: Jr.
                    nullable: true
                    type: string
                updated_at:
                    description: Timestamp when the individual was last updated
                    example: "2024-01-20T14:45:00Z"
                    format: date-time
                    type: string
            required:
                - id
                - first_name
                - last_name
                - household_id
                - is_primary
                - is_grantor
                - is_trustee
                - is_beneficiary
                - is_deceased
                - created_at
                - updated_at
            type: object
        IndividualList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/Individual'
                    type: array
                page_info:
                    $ref: '#/components/schemas/PageInfo'
                total_count:
                    description: Total number of items matching the query (across all pages)
                    example: 100
                    type: integer
            required:
                - data
                - page_info
                - total_count
            type: object
        PageInfo:
            properties:
                end_cursor:
                    description: Cursor pointing to the last item in the current page
                    example: eyJpZCI6ImhvdXNlaG9sZF8wMUFSWjNOREVLVFNWNFJSRkZRNjlHNUZBViJ9
                    nullable: true
                    type: string
                has_next_page:
                    description: When paginating forwards, are there more items?
                    example: true
                    type: boolean
                has_previous_page:
                    description: When paginating backwards, are there more items?
                    example: false
                    type: boolean
                start_cursor:
                    description: Cursor pointing to the first item in the current page
                    example: eyJpZCI6ImhvdXNlaG9sZF8wMUFSWjNOREVLVFNWNFJSRkZRNjlHNUZBViJ9
                    nullable: true
                    type: string
            required:
                - has_next_page
                - has_previous_page
            type: object
        UpdateDocumentRequest:
            properties:
                enable_ai_suggestions:
                    description: Whether this document should be used for AI suggestions
                    type: boolean
                entity_id:
                    description: Entity ID if this document is owned by an entity
                    nullable: true
                    type: string
                individual_id:
                    description: Individual ID if associated with an individual
                    nullable: true
                    type: string
                name:
                    description: Display name of the document
                    minLength: 1
                    type: string
                type:
                    $ref: '#/components/schemas/DocumentType'
            type: object
        UpdateDocumentSummaryRequest:
            properties:
                display_name:
                    description: Display name for the summary
                    minLength: 1
                    type: string
                entry_mode:
                    $ref: '#/components/schemas/DocumentSummaryEntryMode'
                summary:
                    description: The summary text content
                    type: string
                summary_format:
                    $ref: '#/components/schemas/DocumentSummaryFormat'
            type: object
        UpdateHouseholdRequest:
            properties:
                external_id:
                    description: Customer-supplied identifier from an external system. Unique within the caller's tenant when set. Send null to clear.
                    example: crm-household-12345
                    minLength: 1
                    nullable: true
                    type: string
                notes:
                    description: Notes about the household
                    maxLength: 65536
                    nullable: true
                    type: string
                primary_relationship_owner_id:
                    description: User ID of the primary relationship owner
                    example: user_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
            type: object
        UpdateIndividualRequest:
            properties:
                address_line1:
                    description: Street address line 1
                    minLength: 1
                    nullable: true
                    type: string
                address_line2:
                    description: Street address line 2
                    minLength: 1
                    nullable: true
                    type: string
                city:
                    description: City
                    minLength: 1
                    nullable: true
                    type: string
                country:
                    description: Country
                    minLength: 1
                    nullable: true
                    type: string
                date_of_birth:
                    description: Date of birth
                    format: date
                    nullable: true
                    type: string
                date_of_death:
                    description: Date of death if applicable
                    format: date
                    nullable: true
                    type: string
                email:
                    description: Email address
                    format: email
                    nullable: true
                    type: string
                first_name:
                    description: First name of the individual
                    minLength: 1
                    type: string
                is_beneficiary:
                    description: Whether this client profile should be an eligible beneficiary for entities and gifts
                    type: boolean
                is_deceased:
                    description: Whether the individual is deceased
                    type: boolean
                is_grantor:
                    description: Whether this client profile should be an eligible grantor/owner/other principal for entities
                    type: boolean
                is_primary:
                    description: Whether this is a primary client of the household (at most 2 per household)
                    type: boolean
                is_trustee:
                    description: Whether this client profile should be an eligible trustee for entities
                    type: boolean
                last_name:
                    description: Last name of the individual
                    minLength: 1
                    type: string
                middle_name:
                    description: Middle name of the individual
                    minLength: 1
                    nullable: true
                    type: string
                notes:
                    description: Notes about the client profile
                    maxLength: 65536
                    nullable: true
                    type: string
                postal_code:
                    description: ZIP or postal code
                    minLength: 1
                    nullable: true
                    type: string
                state:
                    description: State or province code (2 letter code)
                    maxLength: 2
                    minLength: 2
                    nullable: true
                    type: string
                suffix:
                    description: Name suffix
                    minLength: 1
                    nullable: true
                    type: string
            type: object
        User:
            properties:
                created_at:
                    description: Timestamp when the user was created
                    example: "2024-01-15T09:30:00Z"
                    format: date-time
                    type: string
                email:
                    description: Email address of the user
                    example: jane.doe@example.com
                    format: email
                    type: string
                first_name:
                    description: First name of the user
                    example: Jane
                    type: string
                id:
                    description: Unique identifier with user_ prefix
                    example: user_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                last_name:
                    description: Last name of the user
                    example: Doe
                    type: string
                updated_at:
                    description: Timestamp when the user was last updated
                    example: "2024-01-20T14:45:00Z"
                    format: date-time
                    type: string
            required:
                - id
                - email
                - first_name
                - last_name
                - created_at
                - updated_at
            type: object
        UserList:
            properties:
                data:
                    items:
                        $ref: '#/components/schemas/User'
                    type: array
                page_info:
                    $ref: '#/components/schemas/PageInfo'
                total_count:
                    description: Total number of items matching the query (across all pages)
                    example: 100
                    type: integer
            required:
                - data
                - page_info
                - total_count
            type: object
        Valuation:
            properties:
                created_at:
                    description: Timestamp when the valuation was created
                    example: "2024-01-15T09:30:00Z"
                    format: date-time
                    type: string
                description:
                    description: Free-form notes about this valuation
                    maxLength: 2048
                    nullable: true
                    type: string
                directly_held_asset_value:
                    description: Total value of all directly held assets in USD
                    example: 1e+06
                    format: double
                    type: number
                directly_held_assets:
                    description: List of individual assets in this valuation
                    items:
                        $ref: '#/components/schemas/Asset'
                    type: array
                effective_date:
                    description: The date this valuation is effective
                    example: "2024-01-15"
                    format: date
                    type: string
                entity_id:
                    description: Entity ID this valuation belongs to
                    example: entity_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                id:
                    description: Unique identifier with valuationv2_ prefix
                    example: valuationv2_01ARZ3NDEKTSV4RRFFQ69G5FAV
                    type: string
                total_value:
                    description: Total value of all assets minus liabilities in USD
                    example: 1e+06
                    format: double
                    type: number
                updated_at:
                    description: Timestamp when the valuation was last updated
                    example: "2024-01-20T14:45:00Z"
                    format: date-time
                    type: string
            required:
                - id
                - entity_id
                - effective_date
                - total_value
                - directly_held_asset_value
                - directly_held_assets
                - created_at
                - updated_at
            type: object
    securitySchemes:
        oauth2Profiles:
            flows:
                authorizationCode:
                    authorizationUrl: https://auth.withluminary.com/oauth2/authorize
                    scopes: {}
                    tokenUrl: https://auth.withluminary.com/oauth2/token
                clientCredentials:
                    scopes: {}
                    tokenUrl: https://auth.withluminary.com/oauth2/token
            type: oauth2
info:
    description: RESTful API for managing Luminary data
    title: Luminary API
    version: 1.0.0
openapi: 3.0.3
paths:
    /document-summaries:
        get:
            description: Retrieve a paginated list of document summaries using cursor-based pagination
            operationId: listAllDocumentSummaries
            parameters:
                - description: Filter summaries by household ID
                  in: query
                  name: household_id
                  schema:
                    type: string
                - description: Filter summaries by document ID
                  in: query
                  name: document_id
                  schema:
                    type: string
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentSummaryList'
                    description: List of document summaries
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all document summaries
            tags:
                - Documents
    /document-summaries/{id}:
        get:
            description: Retrieve a specific document summary
            operationId: getDocumentSummary
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentSummary'
                    description: Document summary found
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get a document summary by ID
            tags:
                - Documents
        parameters:
            - description: Document Summary ID
              in: path
              name: id
              required: true
              schema:
                type: string
        put:
            description: Update an existing document summary
            operationId: updateDocumentSummary
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateDocumentSummaryRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentSummary'
                    description: Document summary updated successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Update a document summary
            tags:
                - Documents
    /document-summaries/{id}/download:
        get:
            description: Download the document summary content in the specified format
            operationId: downloadDocumentSummary
            responses:
                "200":
                    content:
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                    description: Document summary file
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Download document summary as PDF
            tags:
                - Documents
        parameters:
            - description: Document Summary ID
              in: path
              name: id
              required: true
              schema:
                type: string
            - description: Output format for the download
              in: query
              name: format
              schema:
                default: pdf
                enum:
                    - pdf
                type: string
    /documents:
        get:
            description: Retrieve a paginated list of documents using cursor-based pagination
            operationId: listDocuments
            parameters:
                - description: Filter documents by household ID
                  in: query
                  name: household_id
                  schema:
                    type: string
                - description: Filter by document type
                  in: query
                  name: type
                  schema:
                    $ref: '#/components/schemas/DocumentType'
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentList'
                    description: List of documents
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all documents
            tags:
                - Documents
        post:
            description: Create a new document with file content
            operationId: createDocument
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/CreateDocumentRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Document'
                    description: Document created successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Upload a new document
            tags:
                - Documents
    /documents/{id}:
        delete:
            description: Soft delete a document (marks as deleted but preserves data)
            operationId: deleteDocument
            responses:
                "204":
                    description: Document deleted successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Delete a document
            tags:
                - Documents
        get:
            description: Retrieve document metadata
            operationId: getDocument
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Document'
                    description: Document found
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get a document by ID
            tags:
                - Documents
        parameters:
            - description: Document ID
              in: path
              name: id
              required: true
              schema:
                type: string
        put:
            description: Update document metadata only
            operationId: updateDocument
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateDocumentRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Document'
                    description: Document updated successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Update a document
            tags:
                - Documents
    /documents/{id}/document-summaries:
        get:
            description: Retrieve all summaries associated with a specific document
            operationId: listDocumentSummaries
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                properties:
                                    data:
                                        items:
                                            $ref: '#/components/schemas/DocumentSummary'
                                        type: array
                                required:
                                    - data
                                type: object
                    description: List of document summaries
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get summaries for a document
            tags:
                - Documents
        parameters:
            - description: Document ID
              in: path
              name: id
              required: true
              schema:
                type: string
    /documents/{id}/download:
        get:
            description: Download the binary content of the document file
            operationId: downloadDocument
            responses:
                "200":
                    content:
                        application/octet-stream:
                            schema:
                                format: binary
                                type: string
                        application/pdf:
                            schema:
                                format: binary
                                type: string
                        application/vnd.apple.numbers:
                            schema:
                                format: binary
                                type: string
                        application/vnd.apple.pages:
                            schema:
                                format: binary
                                type: string
                        application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
                            schema:
                                format: binary
                                type: string
                        application/vnd.openxmlformats-officedocument.wordprocessingml.document:
                            schema:
                                format: binary
                                type: string
                        image/jpeg:
                            schema:
                                format: binary
                                type: string
                        image/png:
                            schema:
                                format: binary
                                type: string
                        text/csv:
                            schema:
                                format: binary
                                type: string
                        text/plain:
                            schema:
                                format: binary
                                type: string
                    description: Document file content
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Download document file content
            tags:
                - Documents
        parameters:
            - description: Document ID
              in: path
              name: id
              required: true
              schema:
                type: string
    /entities:
        get:
            description: Retrieve a paginated list of entities (trusts, businesses, accounts, etc.) using cursor-based pagination
            operationId: listEntities
            parameters:
                - description: Filter entities by household ID
                  in: query
                  name: household_id
                  schema:
                    type: string
                - description: Filter by entity kind/type
                  in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/EntityKind'
                - description: Filter by external ID (exact match within the caller's tenant)
                  in: query
                  name: external_id
                  schema:
                    minLength: 1
                    type: string
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntityList'
                    description: List of entities
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all entities
            tags:
                - Entities
    /entities/{id}:
        delete:
            description: Delete an entity and all of it's related data
            operationId: deleteEntity
            responses:
                "204":
                    description: Entity deleted successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Delete an entity
            tags:
                - Entities
        get:
            description: Retrieve detailed information about a specific entity
            operationId: getEntity
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Entity'
                    description: Entity found
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get an entity by ID
            tags:
                - Entities
        parameters:
            - description: Entity ID
              in: path
              name: id
              required: true
              schema:
                type: string
    /entities/{id}/valuation:
        get:
            description: Retrieve the most recent valuation with flattened asset values by type
            operationId: getEntityCurrentValuation
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Valuation'
                    description: Current valuation found
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get the current valuation for an entity
            tags:
                - Entities
                - Valuations
        parameters:
            - description: Entity ID
              in: path
              name: id
              required: true
              schema:
                type: string
        post:
            description: Add a new valuation to the entity's history
            operationId: createEntityValuation
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateValuationRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Valuation'
                    description: Valuation created successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Create a new valuation for an entity
            tags:
                - Entities
                - Valuations
    /households:
        get:
            description: Retrieve a paginated list of households using cursor-based pagination
            operationId: listHouseholds
            parameters:
                - description: Filter by external ID (exact match within the caller's tenant)
                  in: query
                  name: external_id
                  schema:
                    minLength: 1
                    type: string
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/HouseholdList'
                    description: List of households
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all households
            tags:
                - Households
        post:
            description: Create a new household with the provided data
            operationId: createHousehold
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateHouseholdRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Household'
                    description: Household created successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Create a new household
            tags:
                - Households
    /households/{id}:
        delete:
            description: Soft delete a household (marks as deleted but preserves data)
            operationId: deleteHousehold
            responses:
                "204":
                    description: Household deleted successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Delete a household
            tags:
                - Households
        get:
            description: Retrieve detailed information about a specific household
            operationId: getHousehold
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Household'
                    description: Household found
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get a household by ID
            tags:
                - Households
        parameters:
            - description: Household ID
              in: path
              name: id
              required: true
              schema:
                type: string
        put:
            description: Update an existing household with new data
            operationId: updateHousehold
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateHouseholdRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Household'
                    description: Household updated successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Update a household
            tags:
                - Households
    /households/{id}/documents:
        get:
            description: Retrieve a paginated list of documents belonging to a specific household
            operationId: listHouseholdDocuments
            parameters:
                - description: Filter by document type
                  in: query
                  name: type
                  schema:
                    $ref: '#/components/schemas/DocumentType'
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DocumentList'
                    description: List of documents in the household
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all documents in a household
            tags:
                - Households
                - Documents
        parameters:
            - description: Household ID
              in: path
              name: id
              required: true
              schema:
                type: string
    /households/{id}/entities:
        get:
            description: Retrieve a paginated list of entities belonging to a specific household
            operationId: listHouseholdEntities
            parameters:
                - description: Filter by entity kind/type
                  in: query
                  name: kind
                  schema:
                    $ref: '#/components/schemas/EntityKind'
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/EntityList'
                    description: List of entities in the household
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all entities in a household
            tags:
                - Households
                - Entities
        parameters:
            - description: Household ID
              in: path
              name: id
              required: true
              schema:
                type: string
    /households/{id}/individuals:
        get:
            description: Retrieve a paginated list of client profiles/individuals belonging to a specific household
            operationId: listHouseholdIndividuals
            parameters:
                - description: Filter by primary client status
                  in: query
                  name: is_primary
                  schema:
                    type: boolean
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IndividualList'
                    description: List of individuals in the household
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all individuals in a household
            tags:
                - Households
                - Individuals
        parameters:
            - description: Household ID
              in: path
              name: id
              required: true
              schema:
                type: string
    /individuals:
        get:
            description: Retrieve a paginated list of client profiles/individuals using cursor-based pagination
            operationId: listIndividuals
            parameters:
                - description: Filter individuals by household ID
                  in: query
                  name: household_id
                  schema:
                    type: string
                - description: Filter by primary client status
                  in: query
                  name: is_primary
                  schema:
                    type: boolean
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/IndividualList'
                    description: List of individuals
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all individuals (client profiles)
            tags:
                - Individuals
        post:
            description: Create a new client profile/individual with the provided data
            operationId: createIndividual
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CreateIndividualRequest'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Individual'
                    description: Individual created successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Create a new individual (client profile)
            tags:
                - Individuals
    /individuals/{id}:
        delete:
            description: Soft delete a client profile (marks as deleted but preserves data)
            operationId: deleteIndividual
            responses:
                "204":
                    description: Individual deleted successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Delete an individual
            tags:
                - Individuals
        get:
            description: Retrieve detailed information about a specific client profile
            operationId: getIndividual
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Individual'
                    description: Individual found
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Get an individual by ID
            tags:
                - Individuals
        parameters:
            - description: Individual ID
              in: path
              name: id
              required: true
              schema:
                type: string
        put:
            description: Update an existing client profile with new data
            operationId: updateIndividual
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/UpdateIndividualRequest'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Individual'
                    description: Individual updated successfully
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: Update an individual
            tags:
                - Individuals
    /users:
        get:
            description: Retrieve a paginated list of users using cursor-based pagination
            operationId: listUsers
            parameters:
                - $ref: '#/components/parameters/AfterCursor'
                - $ref: '#/components/parameters/BeforeCursor'
                - $ref: '#/components/parameters/Limit'
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UserList'
                    description: List of users
                default:
                    $ref: '#/components/responses/DefaultError'
            summary: List all users
            tags:
                - Users
