name: Luminary
description: >-
  Luminary is AI-powered estate planning software for wealth advisors, family
  offices, attorneys, and professional services firms. It turns static estate
  planning documents into organized, digital records — with AI document
  digitization and summarization, dynamic estate flowcharts and waterfalls,
  scenario modeling, and role-based collaboration. Its public REST API (v1)
  exposes households, individuals, entities, documents, AI document summaries,
  and entity valuations so estate data can sync with CRMs, client portals, and
  planning tools. First-party TypeScript and Go SDKs are published on GitHub.
  OAuth2-secured (authorizationCode + clientCredentials) and SOC 2 Type II
  audited. Backed by 8vc.
